<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Image + Info Columns</title>
    <link rel="stylesheet" href="Page2.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap');
    </style>

</head>

<body>
    <header>
        <div class="Logo-container">
            <a href="page1.html"><button id="Logo"></button></a>
        </div>

        <div class="Directory-container">
            <a href="nothing.html">
                <button class="Directory" id="About">ABOUT ME</button>
            </a>
            <a href="page2.html">
                <button class="Directory" id="Projects">PROJECTS</button>
            </a>
        </div>
    </header>

    <div class="container">
        <div id="left-wrapper">
            <div id="scrollContainer" class="left-column scrollBox">
            </div>
        </div>

        <div class="right-column">
            <div id="detailImageContainer">
                <img id="detailImage" aria-label="" src="" alt="">
            </div>
            <div class="projectSummary">
                <h1 id="detailTitle"></h1>
                <p id="detailText">Select an image to see its description.</p>
                <a id="detailLinkContainer" href="#">
                    <button id="detailLink">Documentation</button>
                </a>
            </div>

        </div>
    </div>

    <script src="Page2.js"></script>
</body>

</html>
